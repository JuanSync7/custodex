# Feature catalog — `monitor` subsystem (the drift orchestration loop).
# Golden source of truth (EPIC R). Do not duplicate this prose elsewhere; the
# rendered feature-doc/FEATURES.md and the R-07 source wiki read from here.
features:
  - id: FEAT-MONITOR-001
    title: End-to-end drift orchestration loop
    summary: >-
      Monitor.run runs the full pipeline per detected drift: detect (check) ->
      per-drift backend verdict -> build + record a ReviewRecord -> optionally
      apply a FIX -> re-detect, returning a MonitorResult of handled drifts,
      remaining drifts, and records. Every collaborator (backend, sink, now
      clock) is injected so the loop runs offline and deterministically.
    subsystem: monitor
    modules: [monitor]
    constraints: [K1, K4, K10]

  - id: FEAT-MONITOR-002
    title: Pure detect delegate
    summary: >-
      Monitor.check returns a DriftReport by delegating to drift.detect over the
      config and config_dir, mutating nothing — the read-only detection step the
      run loop opens and closes with.
    subsystem: monitor
    modules: [monitor]
    constraints: [K1]

  - id: FEAT-MONITOR-003
    title: Opt-in auto-apply heal path
    summary: >-
      run applies a fix only when apply is effectively true (overriding
      config.apply_default) AND the backend returned a FIX with a non-null fix,
      calling heal.apply_fix at the write boundary; otherwise it mutates nothing.
      It computes the human-owned preserve set and per-region modes from the spec
      so apply_fix cannot clobber human regions.
    subsystem: monitor
    modules: [monitor]
    constraints: [K5, K7]

  - id: FEAT-MONITOR-004
    title: Every verdict is always recorded and emitted
    summary: >-
      For every drift, run builds a ReviewRecord via _record_for, appends it to
      the review log, and emits it to the central sink — regardless of verdict —
      so INVALIDATE/ESCALATE are surfaced for a human and never silently dropped.
    subsystem: monitor
    modules: [monitor]
    constraints: [K5]

  - id: FEAT-MONITOR-005
    title: Self-describing record provenance snapshot
    summary: >-
      Each ReviewRecord carries a config_snapshot (backend kind, root) plus an
      optional source_sha, a deterministic record_id, and a joinable ticket
      (CDM-<record_id>); a rule-resolved record additionally stamps
      resolved_by="rule" and a body-tier run records fingerprint_body_tier=True,
      both additively.
    subsystem: monitor
    modules: [monitor]
    constraints: [K6, K10]

  - id: FEAT-MONITOR-006
    title: Recheck-after-apply remaining set
    summary: >-
      After processing all drifts, run performs a fresh check() and returns its
      drifts as remaining, so a FIX'd drift drops out while ESCALATE or unapplied
      drift persists — the idempotent recheck that proves a heal converged.
    subsystem: monitor
    modules: [monitor]
    constraints: [K7, K10]

  - id: FEAT-MONITOR-007
    title: Opt-in promoted-rule resolution (zero backend calls)
    summary: >-
      When rules are supplied, run resolves a matching drift via
      promotion.rule_for with ZERO backend calls — the learned cost-curve win —
      synthesizing a RULE_CAUSE_PREFIX cause, recording and emitting it marked
      RULE-sourced, and applying nothing (rules carry no fix). The default empty
      rules tuple keeps every drift going to the backend.
    subsystem: monitor
    modules: [monitor]
    constraints: [K4, K5, K6]

  - id: FEAT-MONITOR-008
    title: Opt-in few-shot exemplar retrieval
    summary: >-
      When use_exemplars is on, run reads the review log and resolutions log ONCE
      up front and, per drift, ranks the most-similar past RESOLVED records via
      similar.rank_similar (top_n) to attach as exemplars on the FixRequest; the
      default OFF reads nothing and leaves exemplars empty.
    subsystem: monitor
    modules: [monitor]
    constraints: [K4, K6]

  - id: FEAT-MONITOR-009
    title: Region-authority-aware fix request
    summary: >-
      run builds each FixRequest with the drifted region's authority mode
      (RegionMode, defaulting to GENERATED for a whole-doc drift), an index_body
      for an index-sourced region, opt-in writing style_guidance for a
      no-renderer llm region via _style_guidance_for, and the document's
      context_refs + repo_root — so a backend authors prose vs renders
      mechanically as the region dictates.
    subsystem: monitor
    modules: [monitor]
    constraints: [K6]

  - id: FEAT-MONITOR-010
    title: Tiered apply — never write a document that needs human intent
    summary: >-
      `Monitor.run(tiered=...)` (overriding `apply_tiered`, default OFF) confines the
      write to the documents the ENGINE alone could close — every actionable drift on
      them code-derived, per `drift.mechanical_docs`. A document carrying any drift that
      needs human intent is still sent to the backend, so the reviewer receives a
      ReviewRecord with both the drift and a proposed fix (K5), but nothing on it is
      applied. On the mechanical path no backend is consulted at all, so tiered mode
      REPLACES the authority there rather than merely narrowing it: it can write a
      document a declining backend would have left alone. On every other document it
      is strictly narrower. The restraint is the point: applying a document's HASH fix
      while its sibling prose region is ESCALATED destroys the ONLY staleness trigger
      that region has, because heal stamps the fingerprint even when it skips the
      region — so the recheck comes back empty, `cdx check` is green forever, and the
      human is never asked again. Default OFF keeps run byte-identical.
    subsystem: monitor
    modules: [monitor, config]
    constraints: [K5, K6, K7, K9, K11]

  - id: FEAT-MONITOR-011
    title: The apply_tiered leak gate — the knob is passed explicitly off the CLI
    summary: >-
      `tiered=None` resolves to the repo's `apply_tiered`, which means every call site
      that omits it opts in BY OMISSION. MCP-02 ratified the opposite rule in writing
      for `apply` (a repo's config must never implicitly trigger a write for a remote
      agent), and the server's docs-PR route loads the config of a CLONED, untrusted
      repo — an adopter's own config must not decide the server's authoring authority.
      So `syncpr.sync_pr` takes an explicit `tiered` parameter defaulting to OFF (which
      covers sync-pr, open-docs-pr, the server route and the MCP sync tool in one
      place), the MCP remediation tool forces it OFF, and onboarding's arrive-green
      self-validation forces the FULL apply. A source-level guard asserts that no
      `Monitor.run(apply=...)` outside those sites omits `tiered=`, because a leak is
      invisible at runtime — the call simply inherits the knob.
    subsystem: monitor
    modules: [monitor, syncpr, mcp]
    constraints: [K5, K11]

  - id: FEAT-MONITOR-012
    title: The engine closes the mechanical path itself — zero backend calls
    summary: >-
      Under tiered mode a document whose every actionable drift is code-derived is
      closed by the ENGINE with no backend consulted at all: there is no model
      judgement to be confident about, because the bytes are the engine's own
      projection of the surface produced by the same functions heal calls. The fix
      SHAPES mirror the mock backend's two rules exactly — region-scoped for a REGION,
      whole-doc for a HASH — and the region body comes from the SAME index-aware
      selector detect grades against, so an index region is rendered by the
      index-aware layer rather than written wrong. Keeping the shapes apart matters:
      one whole-doc fix per document would make a REGION close rewrite front matter it
      never touches today, which on a legacy composite-only doc silently adds the
      per-tier and per-symbol digests the severity classifier needs to move a FUTURE
      HASH drift from unknown to cosmetic — the unattended write would widen what it
      may next write unattended. The promoted-rule layer keeps its precedence, so a
      verdict humans reached repeatedly is never overwritten by an engine write, and a
      drift routing called mechanical that the engine cannot render becomes a loud
      ESCALATE rather than a silent FIX carrying no fix.
    subsystem: monitor
    modules: [monitor, heal, blocks]
    constraints: [K2, K4, K5, K7, K8, K10]
