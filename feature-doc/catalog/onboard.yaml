# Feature catalog — `onboard` subsystem (AGT-04: the config-authoring agent).
# Kills the #1 measured adoption friction (the 2026-07-02 fresh-eyes simulation:
# mapping was 100% hand-authored YAML): analyze → reviewable plan → propose real
# UnitFile models → human-invoked apply → self-validated arrive-green bundle.
# Golden source of truth (EPIC R discipline).
features:
  - id: FEAT-ONBOARD-001
    title: "`cdx onboard` — analyze a repo, author its config, arrive green"
    summary: >-
      onboard.analyze_repo scans a repo tree into a reviewable RepoMap plan artifact
      (the Mintlify plan-before-config pattern): top-level packages with their .py
      files and extracted public-symbol counts (per-file try/except — one unparseable
      source becomes a plan WARNING, never an abort), doc candidates with audience
      GUESSES that carry their evidence (silent inference is banned; README/tutorial/
      usage-style names → user-guide, else eng-guide), the repo self-description
      signals (README, AGENTS.md, CLAUDE.md, docs dir, an existing config), and
      loose-file warnings. propose_config derives the bundle DETERMINISTICALLY (no
      LLM in this slice — K10/K11): one unit per top-level package (dir-covered = its
      directory, .py sources), one eng-guide document per package covering its files,
      the README mapped as a user-guide narrative document, and the REQUIRED unit
      owner via the pinned precedence (--owner → git user.name via an injected CLI
      seam → "unassigned" + a plan note, because it feeds the EPIC-OWN accountability
      chain); reserved config stems are skipped with a note. The default `cdx
      onboard` run is a DRY-RUN that prints the Renovate-style plan (Detected
      surfaces / Proposed mapping / What to expect) and writes NOTHING — agents
      suggest, humans apply (K11). `--apply` writes the bundle (real UnitFile models
      through dump_unit_file — fresh files, so the model dump is correct here),
      scaffolds each proposed doc in-sync, heals with the offline mock backend, and
      SELF-VALIDATES: load_bundle + doctor (no FAIL) + 0 drift, or the command exits
      loudly (the arrive-green rule — never emit a config the tool itself rejects,
      K8). Refuses to clobber an existing config without --force.
    subsystem: onboard
    modules: [onboard, cli]
    constraints: [K0, K8, K10, K11]
    status: implemented
  - id: FEAT-ONBOARD-002
    title: The `cdx init --v2` dead-on-arrival fix (writing templates ensured)
    summary: >-
      The fresh-eyes adoption simulation measured the v2 scaffold as UNUSABLE in a
      bare repo: the scaffolded doc-style.yaml references four writing templates
      under templates/writing/ that only repos like this one ship, so even `cdx
      doctor` died at config load. templates_v2.ensure_writing_templates(repo_root)
      materializes a minimal generic file for exactly the four referenced (category,
      stem) pairs — kept in ONE WRITING_TEMPLATE_STEMS constant so the doc-style map
      and the ensured files can never drift apart — writing ONLY absent files (a
      repo's real templates are never overwritten; re-run returns (), K7). BOTH
      scaffold paths call it: scaffold_config_dir (the `cdx init --v2` path, fixed
      for every future adopter) and onboard.apply_plan — so a fresh scaffold's
      load_bundle succeeds in ANY bare repo, regression-guarded by a
      scaffold-then-load test in an empty tmp tree.
    subsystem: onboard
    modules: [onboard, templates_v2, cli]
    constraints: [K0, K7, K8]
    status: implemented
