---
# Frontmatter (REQUIRED): repo identity + provenance.
cdmon-config-version: "2.0.0"
repo: "demo-taskflow"
generated-by: cdx
updated: "2026-06-13T03:29:03.849107+00:00"
---
# Body: the globals that merge into one MonitorConfig + the ordered unit index.

# Repo root RELATIVE TO this config directory. config/cdmon/ sits two levels
# below the demo repo root (demo/), so the canonical "../.." lands on demo/.
root: "../.."

version: "2.0.0"
apply_default: false

# Offline mock backend (deterministic, no network) — the default for CI/demo.
backend:
  kind: mock

# LangGraph remediation runtime (only used when backend.kind: agent).
agent:
  driver: claude-code

# Standalone demo: emit review records to the local log only (M-02 wires the
# central :33333 registration).
central:
  sink: none

# Global coverage block: intentional, justified documentation gaps. The package
# __init__.py files are pure re-export aggregators with no behavior of their own.
coverage:
  waive:
    - path: "src/taskflow/core/__init__.py"
      reason: "re-export aggregator; surface documented in core-api"
    - path: "src/taskflow/io/__init__.py"
      reason: "re-export aggregator; surface documented in io-api"
    - path: "tests/__init__.py"
      reason: "docstring-only test-package marker; no documentable surface (the test-doc mirror covers the test modules themselves)"

# AGT-01 mention layer: the curated stoplist that keeps the demo's rot signal
# EMPTY out of the box (DEMO-099) — the same triage the parent repo dogfoods.
# Groups, each justified:
#   * config-schema KEYS quoted in prose, below symbol granularity:
#     code_refs, context_refs, local_path, suggested_unit
#   * toolchain conventions / runtime artifacts, not committed tree entries:
#     __pycache__, core/notes.log (written by the tutorial's own task run)
#   * PARENT-repo paths & engine symbols: this fixture doubles as the parent
#     repo's live-demo seed, and the README documents that role — those
#     referents live outside this standalone tree:
#     demo/, demo/config/cdmon, scripts/seed_demo.py, seed_demo.py,
#     tests/system/test_gitrepo_sync_e2e.py, generate.apply_record_fix,
#     generate.apply_edits_to_disk, add_code_ref
#   * external library classes: TestClient
entities:
  ignore:
    - code_refs
    - context_refs
    - local_path
    - suggested_unit
    - __pycache__
    - core/notes.log
    - demo/
    - demo/config/cdmon
    - scripts/seed_demo.py
    - seed_demo.py
    - tests/system/test_gitrepo_sync_e2e.py
    - generate.apply_record_fix
    - generate.apply_edits_to_disk
    - add_code_ref
    - TestClient

# REQUIRED index of every unit file in this directory (stable, ordered). Every
# *.yaml unit on disk MUST be listed (run `cdx index` to regenerate).
units:
  - file: core.yaml
  - file: io.yaml
  - file: tests.yaml
# Pointers to the ignore + doc-style files.
ignore: ignore.yaml
doc-style: doc-style.yaml
